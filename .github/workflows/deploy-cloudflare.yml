name: 🐺👑 Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - 'wrangler.toml.example'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔄 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🔍 Verify secrets exist
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "❌ ERROR: CLOUDFLARE_API_TOKEN secret is missing!"
            exit 1
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo "❌ ERROR: CLOUDFLARE_ACCOUNT_ID secret is missing!"
            exit 1
          fi
          echo "✅ Both secrets exist"

      - name: 🔧 Create wrangler.toml if missing
        run: |
          if [ ! -f wrangler.toml ]; then
            if [ -f wrangler.toml.example ]; then
              cp wrangler.toml.example wrangler.toml
            else
              cat > wrangler.toml << 'EOF'
          name = "wolf-empire"
          main = "worker.js"
          compatibility_date = "2024-09-23"

          [vars]
          ADMIN_PASSWORD = "SUKOT"
          UUID = "06472f28-8568-4e61-9bd1-8ed64f25acc1"
          EOF
            fi
          fi

      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: ✅ Notify success
        run: |
          echo "🐺👑 Master Yousef Wolf Empire deployed successfully!"
          echo "⛓⛓⛓⛓⛓⛓⛓⛓⛓⛓⛓⛓⛓⛓⛓⛓"
          echo "🐾 🐾 🐾"
