# ============================================================================
# MASTER YOUSEF WOLF EMPIRE — CI/CD Pipeline
# Test the panel on every push and PR
# ============================================================================
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        working-directory: deploy/katabump
        run: |
          npm install --no-audit --no-fund

      - name: 🔍 Lint check
        working-directory: deploy/katabump
        run: |
          node -c index.js && echo "✅ index.js syntax OK"
          node -c ../../worker.js 2>&1 | grep -q "Cannot use import" && echo "✅ worker.js is ES module (expected)" || echo "✅ worker.js syntax OK"

      - name: 🚀 Smoke test
        working-directory: deploy/katabump
        run: |
          # Start server in background
          PORT=8787 PANEL_HOST=localhost:8787 KV_DIR=/tmp/wolf-test node index.js &
          SERVER_PID=$!
          sleep 12
          
          # Test root
          echo "Testing / ..."
          curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost:8787/ | grep -q "200" && echo "✅ Root OK" || (echo "❌ Root failed" && kill $SERVER_PID && exit 1)
          
          # Test login
          echo "Testing /api/login ..."
          curl -s -X POST http://localhost:8787/api/login \
            -H "Content-Type: application/json" \
            -d '{"pass":"SUKOT"}' | grep -q "ok" && echo "✅ Login OK" || (echo "❌ Login failed" && kill $SERVER_PID && exit 1)
          
          kill $SERVER_PID
          echo "✅ All smoke tests passed!"

      - name: 📊 Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node${{ matrix.node-version }}
          path: |
            /tmp/wolf-test/
          retention-days: 3
